name: Validate localization project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release gates and source diffing
        run: python -m unittest discover -s tests -v
      - name: Validate inventory and existing payloads
        run: python scripts/rwtranslations.py validate
      - name: Check deterministic registry data
        run: |
          python scripts/rwtranslations.py registry
          python -c "import json; d=json.load(open('registry.json')); assert d['counts']['translations']==len(d['mods'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-validation-report
          path: reports/validation.json
