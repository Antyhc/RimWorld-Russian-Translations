name: Monitor configured upstream sources
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: source-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rwtranslations.py monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Maintain one report issue only when its state changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/source-monitor.json', 'utf8'));
            const title = '[source-monitor] Upstream localization changes';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'all', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(x => x.title === title && !x.pull_request);
            const marker = `<!-- source-monitor:${report.fingerprint} -->`;
            if (report.action_required) {
              const changes = report.mods.filter(x => ['changed', 'error'].includes(x.status));
              const lines = changes.map(x => x.status === 'error'
                ? `- ${x.package_id}: source check failed; inspect the workflow artifact.`
                : `- ${x.package_id}: ${x.delta.added.length} added, ${x.delta.changed.length} changed, ${x.delta.removed.length} removed keys.`);
              for (const pr of (report.integrations || []).filter(x => x.action_required)) lines.push(`- ${pr.package_id}: upstream PR status ${pr.status}; ${pr.pr_url || 'inspect workflow artifact'}.`);
              for (const file of (report.file_monitors || []).filter(x => ['changed_files', 'error'].includes(x.status))) lines.push(file.status === 'error'
                ? `- ${file.package_id}: upstream repository tree check failed; inspect the workflow artifact.`
                : `- ${file.package_id}: ${file.delta.added.length} added, ${file.delta.changed.length} changed, ${file.delta.removed.length} removed upstream files; translation impact needs review.`);
              const body = `${marker}\nConfigured source files need attention. Existing Russian translations were preserved.\n\n${lines.join('\n')}\n\nReview the workflow artifact; prepare and review update candidates locally. Steam upload and author outreach are never performed by this workflow.`;
              if (!issue) await github.rest.issues.create({owner, repo, title, body});
              else if (!issue.body?.includes(marker) || issue.state !== 'open') await github.rest.issues.update({owner, repo, issue_number: issue.number, body, state: 'open'});
            } else if (issue?.state === 'open') {
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
            }
      - uses: actions/upload-artifact@v4
        with:
          name: source-monitor-report
          path: reports/source-monitor.json
